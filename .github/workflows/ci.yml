name: CI

# Push-to-main validation is already done by auto-tag.yml, so this runs on PRs only.
on:
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "dev-to/**", "LICENSE", ".github/ISSUE_TEMPLATE/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install --include=dev

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke-test CLI (scan example configs)
        run: |
          node dist/cli.js examples/secure-config.json --format=table
          node dist/cli.js examples/minimal-config.json --format=json || true
          node dist/cli.js examples/vulnerable-config.json --format=sarif || true
